# Unit tests on Claude task branches, before a PR is merged.
# No secrets: a fake google-services.json is written for compilation only
# (docs/RULES.md: never install such a build), and nothing is signed or uploaded.
# record=true (manual run) writes goldens that do not exist yet and commits only
# those new files to the branch for review. A changed existing golden fails the run.
name: Branch tests

on:
  push:
    # main: runs after each merge and seeds the Gradle cache that every branch can read.
    branches: ["main", "claude/**", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      record:
        description: "Record goldens (true/false)"
        required: false
        default: "false"

# contents: write is used only by a manual record run, to commit goldens that did not exist.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.record == 'true' && format('branch-tests-record-{0}', github.run_id) || format('branch-tests-{0}', github.head_ref || github.ref_name) }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.record == 'true') }}
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle dependencies, the build cache and the configuration cache between runs.
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Branches write their own cache too (reruns on the same branch); main's run seeds every branch.
          cache-read-only: false

      - name: Install Android SDK
        run: |
          set -euo pipefail
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "${ANDROID_HOME}/cmdline-tools/latest"
          mkdir -p "${ANDROID_HOME}/licenses"
          printf '%s\n' \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "${ANDROID_HOME}/licenses/android-sdk-license"
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" \
            "platforms;android-36.1" "build-tools;36.0.0" > /dev/null
          set -o pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Write a fake google-services.json (unit tests only, never installed)
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "demo-no-project", "storage_bucket": "demo-no-project.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "com.aistudio.mycalculators.qvxmzt"}},
              "oauth_client": [{"client_id": "000000000000-fake.apps.googleusercontent.com", "client_type": 3}],
              "api_key": [{"current_key": "AIzaFakeKeyForUnitTestsOnly000000000000"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": [{"client_id": "000000000000-fake.apps.googleusercontent.com", "client_type": 3}]}}
            }],
            "configuration_version": "1"
          }
          JSON
          # A missing debug.keystore only matters for packaging, which unit tests skip.

      - name: Verify release permissions
        run: |
          ./gradlew processReleaseMainManifest --no-daemon
          python3 - <<'PYTHON'
          import glob, xml.etree.ElementTree as ET
          paths = glob.glob("app/build/intermediates/merged_manifests/release/**/AndroidManifest.xml", recursive=True)
          paths += glob.glob("app/build/intermediates/merged_manifest/release/**/AndroidManifest.xml", recursive=True)
          assert paths, "Merged release manifest missing"
          for path in paths:
              names = [e.get("{http://schemas.android.com/apk/res/android}name") for e in ET.parse(path).getroot().findall("uses-permission")]
              print("Release permissions:", names)
              assert "android.permission.READ_CALENDAR" not in names
          PYTHON

      - name: Did rules or money documents change?
        id: rules
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE '^(firestore\.|firestore-fixtures/|tools/check-money-docs)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Firestore rules and fixtures unchanged against main: emulator tests skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache firebase-tools and the emulator
        if: steps.rules.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/firebase/emulators
          key: firebase-tools-v1

      - name: Firestore rules emulator tests (no deployment)
        if: steps.rules.outputs.changed == 'true'
        run: |
          npm install --prefix "${RUNNER_TEMP}/firebase" firebase-tools firebase @firebase/rules-unit-testing
          export PATH="${RUNNER_TEMP}/firebase/node_modules/.bin:${PATH}"
          export NODE_PATH="${RUNNER_TEMP}/firebase/node_modules"
          firebase emulators:exec --only firestore --project demo-no-project "node --test firestore.test.js"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --continue

      - name: Coverage thresholds
        if: ${{ github.event.inputs.record != 'true' }}
        run: ./gradlew koverXmlReportDebug koverHtmlReportDebug koverVerifyDebug --no-daemon

      - name: Coverage groups
        if: ${{ github.event.inputs.record != 'true' }}
        run: python3 tools/coverage-groups.py app/build/reports/kover/reportDebug.xml

      - name: Changed-lines coverage
        if: ${{ github.event.inputs.record != 'true' }}
        run: |
          python3 -m pip install diff-cover==9.7.1
          diff-cover app/build/reports/kover/reportDebug.xml --compare-branch=origin/main --fail-under=80 --src-roots app/src/main/java --format markdown:coverage-diff.md

      - name: Coverage summary
        if: ${{ always() && github.event.inputs.record != 'true' }}
        run: |
          if [ ! -f coverage-diff.md ]; then
            echo "Coverage report was not generated." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'No lines with coverage information in this diff' coverage-diff.md; then
            echo "אין שורות קוד נמדדות ב-PR הזה" >> "$GITHUB_STEP_SUMMARY"
          else
            cat coverage-diff.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage HTML
        if: ${{ always() && github.event.inputs.record != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: app/build/reports/kover/htmlDebug
          retention-days: 14

      - name: Test counts
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
              for c in r.iter("testcase"):
                  if c.find("failure") is not None or c.find("error") is not None:
                      print("FAILED", c.get("classname"), c.get("name"))
          print(f"XML: tests={t} failures={f} errors={e} skipped={s}")
          PY

      - name: UX findings (report only, docs/ux/UX-CHECKS.md)
        if: always()
        run: |
          f=app/build/ux-findings/findings.tsv
          if [ ! -f "$f" ]; then echo "UX rules: no findings" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          {
            echo "### UX rules (report only)"
            echo "| rule | findings | screens |"; echo "|---|---:|---:|"
            cut -f3 "$f" | sort | uniq -c | while read n rule; do
              screens=$(awk -F'\t' -v r="$rule" '$3==r{print $1}' "$f" | sort -u | wc -l)
              echo "| $rule | $n | $screens |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::group::UX findings (unique per screen and element)"
          cut -f1,3,4,5 "$f" | sort -u
          echo "::endgroup::"

      - name: Upload goldens and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            app/src/test/snapshots/designsystem
            app/build/outputs/roborazzi
            app/build/test-results/testDebugUnitTest
          retention-days: 7

  record-goldens:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.record == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle dependencies, the build cache and the configuration cache between runs.
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Branches write their own cache too (reruns on the same branch); main's run seeds every branch.
          cache-read-only: false

      - name: Install Android SDK
        run: |
          set -euo pipefail
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "${ANDROID_HOME}/cmdline-tools/latest"
          mkdir -p "${ANDROID_HOME}/licenses"
          printf '%s\n' \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "${ANDROID_HOME}/licenses/android-sdk-license"
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" \
            "platforms;android-36.1" "build-tools;36.0.0" > /dev/null
          set -o pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Write a fake google-services.json (unit tests only, never installed)
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "demo-no-project", "storage_bucket": "demo-no-project.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "com.aistudio.mycalculators.qvxmzt"}},
              "oauth_client": [{"client_id": "000000000000-fake.apps.googleusercontent.com", "client_type": 3}],
              "api_key": [{"current_key": "AIzaFakeKeyForUnitTestsOnly000000000000"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": [{"client_id": "000000000000-fake.apps.googleusercontent.com", "client_type": 3}]}}
            }],
            "configuration_version": "1"
          }
          JSON
          # A missing debug.keystore only matters for packaging, which unit tests skip.

      - name: Unit tests
        run: |
          set -uo pipefail
          if [ "${{ github.event.inputs.record }}" = "true" ]; then
            # Writes only goldens that do not exist yet; a changed existing golden still fails below.
            # Recording fails the tests that wrote an image; the verify below decides the result.
            ./gradlew testDebugUnitTest --no-daemon --continue -Proborazzi.test.record=true || true
            if git diff --quiet -- app/src/test/snapshots; then
              new_files="$(git ls-files --others --exclude-standard -- app/src/test/snapshots)"
              if [ -n "${new_files}" ]; then
                echo "${new_files}"
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add -- ${new_files}
                git commit -m "test: record new goldens"
                git push origin "HEAD:${GITHUB_REF_NAME}"
              fi
            else
              echo "Existing goldens differ; they are not re-recorded:"
              git diff --stat -- app/src/test/snapshots
              exit 1
            fi
            # Verify in the same run, so a green record run means the branch passes with its goldens
            # (the bot commit does not trigger CI by itself).
            ./gradlew testDebugUnitTest --no-daemon --continue
          else
            ./gradlew testDebugUnitTest --no-daemon --continue
          fi
