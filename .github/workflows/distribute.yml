# Never rename or move this workflow: its run number drives versionCode and must not reset.
# Signed APK to Firebase App Distribution.
# CLI: https://firebase.google.com/docs/app-distribution/android/distribute-cli
# Auth: https://firebase.google.com/docs/app-distribution/authenticate-service-account
# GOOGLE_APPLICATION_CREDENTIALS is a path to the service-account JSON, not the JSON itself.
name: Distribute

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Hebrew release notes for the family (empty generates notes)
        type: string
        required: false
      deploy_rules:
        description: Deploy Firestore rules before release
        type: boolean
        default: true
      dry_run:
        description: Build and verify without deploying or releasing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require main for releases
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "Releases run from main only; use dry_run on other branches"
          exit 1

  # Deploy rules first so the new APK never reaches phones before its rules are live.
  rules:
    needs: guard
    if: ${{ inputs.deploy_rules && !inputs.dry_run }}
    uses: ./.github/workflows/firestore-rules.yml
    secrets: inherit

  distribute:
    needs: [guard, rules]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.rules.result == 'success' || needs.rules.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
    steps:
      - name: Fail if a required secret is missing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_SERVICES_JSON FIREBASE_SERVICE_ACCOUNT FIREBASE_APP_ID; do
            value="${!name}"
            if [ -z "${value}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions secret(s): ${missing[*]}"
            echo "No build or upload was started."
            exit 1
          fi
          echo "All required secrets are present."

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          # docs/RULES.md "Local build": platforms;android-36.1, build-tools 36.0.0, JDK 21.
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          rm -rf /tmp/cmdtools
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "${ANDROID_HOME}/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "${ANDROID_HOME}/cmdline-tools/latest"
          mkdir -p "${ANDROID_HOME}/licenses"
          printf '%s\n' \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "${ANDROID_HOME}/licenses/android-sdk-license"
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" \
            "platforms;android-36.1" "build-tools;36.0.0"
          sdk_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "${sdk_status}" -ne 0 ]; then
            echo "sdkmanager failed with status ${sdk_status}"
            exit "${sdk_status}"
          fi
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Write app/google-services.json from the real secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Set release version code
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build the signed release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          tools="${ANDROID_HOME}/build-tools/36.0.0"
          jarsigner -verify -verbose -certs "$aab" > "${RUNNER_TEMP}/aab-verification.txt"
          apk_cert=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')
          aab_cert=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test -n "$apk_cert" && test -n "$aab_cert" && test "$apk_cert" = "$aab_cert" || { echo "Release signing certificates differ or could not be read"; exit 1; }
          echo "Release certificate SHA-256: $apk_cert"
          target=$("$tools/aapt" dump badging "$apk" | sed -n "s/^targetSdkVersion:'\\([0-9]*\\)'/\\1/p")
          test -n "$target" && test "$target" -ge 35 || { echo "Release targetSdk must be at least 35"; exit 1; }
          echo "Release targetSdk: $target"
          python3 - <<'PYTHON'
          import glob, xml.etree.ElementTree as ET
          paths = glob.glob("app/build/intermediates/merged_manifests/release/**/AndroidManifest.xml", recursive=True)
          paths += glob.glob("app/build/intermediates/merged_manifest/release/**/AndroidManifest.xml", recursive=True)
          assert paths, "Merged release manifest missing"
          for path in paths:
              names = [e.get("{http://schemas.android.com/apk/res/android}name") for e in ET.parse(path).getroot().findall("uses-permission")]
              assert "android.permission.READ_CALENDAR" not in names, "READ_CALENDAR present in release manifest"
          print("Release manifest: READ_CALENDAR absent")
          PYTHON

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: myself-${{ env.VERSION_CODE }}.aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Lint debug
        # lint.xml: NewApi is fatal, every other id is a warning.
        # abortOnError fails this step only on NewApi, before the upload.
        run: ./gradlew lintDebug --no-daemon

      - name: Upload to Firebase App Distribution
        if: ${{ !inputs.dry_run }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          # https://firebase.google.com/docs/app-distribution/authenticate-service-account
          cred="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "${cred}"
          export GOOGLE_APPLICATION_CREDENTIALS="${cred}"
          git log -1 --format=%B > "${RUNNER_TEMP}/release-notes.txt"
          npm install --prefix "${RUNNER_TEMP}/firebase" firebase-tools
          # https://firebase.google.com/docs/app-distribution/android/distribute-cli
          "${RUNNER_TEMP}/firebase/node_modules/.bin/firebase" appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app "${FIREBASE_APP_ID}" \
            --groups "family" \
            --release-notes-file "${RUNNER_TEMP}/release-notes.txt"
