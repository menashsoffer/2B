# Signed APK to Firebase App Distribution.
# CLI: https://firebase.google.com/docs/app-distribution/android/distribute-cli
# Auth: https://firebase.google.com/docs/app-distribution/authenticate-service-account
# GOOGLE_APPLICATION_CREDENTIALS is a path to the service-account JSON, not the JSON itself.
name: Distribute

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
    steps:
      - name: Fail if a required secret is missing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_SERVICES_JSON FIREBASE_SERVICE_ACCOUNT FIREBASE_APP_ID; do
            value="${!name}"
            if [ -z "${value}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions secret(s): ${missing[*]}"
            echo "No build or upload was started."
            exit 1
          fi
          echo "All required secrets are present."

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          # docs/RULES.md "Local build": platforms;android-36.1, build-tools 36.0.0, JDK 21.
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          rm -rf /tmp/cmdtools
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "${ANDROID_HOME}/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "${ANDROID_HOME}/cmdline-tools/latest"
          mkdir -p "${ANDROID_HOME}/licenses"
          printf '%s\n' \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "${ANDROID_HOME}/licenses/android-sdk-license"
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" \
            "platforms;android-36.1" "build-tools;36.0.0"
          sdk_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "${sdk_status}" -ne 0 ]; then
            echo "sdkmanager failed with status ${sdk_status}"
            exit "${sdk_status}"
          fi
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Write app/google-services.json from the real secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build the signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          # https://firebase.google.com/docs/app-distribution/authenticate-service-account
          cred="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "${cred}"
          export GOOGLE_APPLICATION_CREDENTIALS="${cred}"
          git log -1 --format=%B > "${RUNNER_TEMP}/release-notes.txt"
          npm install --prefix "${RUNNER_TEMP}/firebase" firebase-tools
          # https://firebase.google.com/docs/app-distribution/android/distribute-cli
          "${RUNNER_TEMP}/firebase/node_modules/.bin/firebase" appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app "${FIREBASE_APP_ID}" \
            --groups "family" \
            --release-notes-file "${RUNNER_TEMP}/release-notes.txt"
