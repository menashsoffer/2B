appId: com.aistudio.mycalculators.qvxmzt.e2e
name: Story states gallery
tags: [states]
---
- launchApp:
    clearState: true
- evalScript: ${output.email = 'galleryplan_only' + Date.now() + '@example.test'}
- openLink: myself-e2e://signin?email=${output.email}&seed=plan_only&today=2026-11-03
- extendedWaitUntil:
    visible: {id: nav_money}
    timeout: 120000
- tapOn: {id: nav_money}
- extendedWaitUntil:
    visible: {id: money_month_title}
    timeout: 120000
- takeScreenshot: gallery_plan_only_month
- tapOn: "התמונה הגדולה"
