# Shared start for every flow: a cleared app that has drawn its first screen
# (the shell, or the sign-in screen).
# Waiting here matters. clearState kills the old process, and a deep link sent while it is
# still dying can leave the link activity with no process, so nothing draws for minutes
# (seen on CI as "nav_money is not visible" in a random flow).
appId: com.aistudio.mycalculators.qvxmzt.e2e
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "nav_home|google_sign_in_button"
    timeout: 60000
